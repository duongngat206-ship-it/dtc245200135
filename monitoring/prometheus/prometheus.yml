global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Prometheus server
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Web application
  - job_name: 'blog_cms_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['blog_app:3000']

  # Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Database metrics
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql_exporter:9104']
